<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Actualizar Tarea</title>
</head>
<body>

  <main>
    <section>
      <h1>Actualizar Tarea</h1>
      <p>Modifique los datos de la tarea seleccionada y guarde los cambios.</p>

      <form action="#" method="post">
        <label for="id">ID de la tarea:</label><br>
        <input type="text" id="id" name="id">
        <br><br>

        <label for="nombre">Nombre de la tarea:</label><br>
        <input type="text" id="nombre" name="nombre">
        <br><br>

        <label for="descripcion">Descripción:</label><br>
        <textarea id="descripcion" name="descripcion" rows="4" cols="40"></textarea>
        <br><br>

        <button type="submit">Guardar cambios</button>
      </form>
    </section>
  </main>

</body>
</html>
